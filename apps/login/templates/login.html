{% extends 'base-login.html' %}
{% block title %}Login{% endblock %}
{% block content %}
    <div class="auth-page">
      <section class="auth-card auth-card-login">
        <h1 class="auth-title">Login</h1>
        {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
        <form class="auth-form" action="" method="POST">
          {% csrf_token %}
          <div class="auth-field">
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username" autocomplete="username" required>
          </div>
          <div class="auth-field">
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <div class="auth-button-row">
            <button class="auth-button auth-button-login" type="submit">Entrar</button>
          </div>
        </form>
        <p class="auth-footer">Não possui cadastro? <a href="{% url 'novo_usuario' %}">Cadastre-se</a>.</p>
      </section>
    </div>
{% endblock %}
