<div class="row mt-5">
    <div class="col-12 col-md-6 mb-3">
        <label for="{{ form.nome_item.id_for_label }}" class="form-label">Nome do item:</label>
        {{ form.nome_item }}
    </div>
    <div class="col-12 col-md-6 mb-3">
        <label for="{{ form.tipo_item.id_for_label }}" class="form-label">Tipo de item:</label>
        {{ form.tipo_item }}
    </div>
    <div class="col-12 col-md-6 col-lg-4 mb-3">
        <label for="{{ form.peso.id_for_label }}" class="form-label">Peso:</label>
        {{ form.peso }}
    </div>
    <div class="col-12 col-md-6 col-lg-4 mb-3">
        <label for="{{ form.raridade.id_for_label }}" class="form-label">Raridade:</label>
        {{ form.raridade }}
    </div>
    <div class="col-12 mb-3">
        <label for="{{ form.descricao_item.id_for_label }}" class="form-label">Descrição do item:</label>
        {{ form.descricao_item }}
    </div>
    <div class="col-12 col-md-6 mb-3">
        <label for="{{ form.nome_encontrador.id_for_label }}" class="form-label">Nome de quem encontrou:</label>
        {{ form.nome_encontrador }}
    </div>
    <div class="col-12 col-md-6 mb-3">
        <label for="{{ form.graduacao.id_for_label }}" class="form-label">Graduação:</label>
        {{ form.graduacao }}
    </div>
    <div class="col-12 col-md-6 mb-3">
        <label for="{{ form.local_encontrado.id_for_label }}" class="form-label">Onde o item foi encontrado:</label>
        {{ form.local_encontrado }}
    </div>
    <div class="col-12 col-md-6 mb-3">
        <label for="{{ form.data_encontrado.id_for_label }}" class="form-label">Data que foi encontrado:</label>
        {{ form.data_encontrado }}
    </div>
</div>
